<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dff3ef" />
  <title>지유의 반짝 루틴섬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="반짝 루틴섬 홈"><span class="brand-mark">✿</span><span>반짝 루틴섬</span></a>
      <div class="top-meta"><span class="date-pill" id="dateLabel"></span><span class="star-pill"><span>★</span><b id="starCount">0</b><small>반짝별</small></span></div>
    </header>

    <section class="island-scene" aria-label="3D 하늘섬 풍경">
      <div class="scene-copy"><span class="eyebrow">JIYOU'S LITTLE WORLD</span><h1>오늘도 한 걸음,<br><em>반짝이는 모험!</em></h1><p id="sceneMessage">작은 해님이 기다리고 있어요 ☀️</p></div>
      <div class="scene-badge"><span class="badge-icon">☁️</span><span><b>오늘의 하늘섬</b><small>루틴을 끝내면 섬이 자라나요</small></span></div>
      <div class="scene-hint">섬을 드래그해서 둘러봐요 <span>↗</span></div>
      <div id="three-scene"></div>
      <div class="scene-wash"></div>
    </section>

    <section class="dashboard">
      <div class="routine-panel">
        <div class="panel-heading"><div><span class="section-kicker">TODAY'S ADVENTURE</span><h2>오늘의 루틴 <span class="sparkle">✦</span></h2></div><div class="progress-ring" id="progressRing"><div><b id="progressCount">0/0</b><small>완료</small></div></div></div>
        <nav class="weekday-tabs" id="weekdayTabs" aria-label="요일 선택"></nav>
        <div class="progress-track"><span id="progressBar"></span></div>
        <div class="routine-list" id="routineList"></div>
        <div class="all-done" id="allDone" hidden><span>🌈</span><div><b>오늘의 모험 완료!</b><small>정말 멋져요. 내일도 반짝여요!</small></div><span class="done-confetti">✦ ✧ ✦</span></div>
      </div>
      <aside class="side-column">
        <div class="buddy-card"><div class="card-topline"><span>오늘의 친구</span><span class="online-dot"></span></div><div class="buddy-emoji">🦊</div><h3>모모가 응원해!</h3><p id="buddyLine">하나씩 해보면 금방이야. 같이 가자!</p><div class="buddy-speech">“넌 할 수 있어!” <span>♡</span></div></div>
        <div class="reward-card"><div class="reward-icon">🎁</div><div><span>오늘의 반짝 보상</span><b id="rewardText">첫 루틴을 완료해 보세요!</b></div><span class="reward-arrow">✧</span></div>
      </aside>
    </section>
    <footer>작은 습관이 모여 멋진 하루가 돼요 <span>✦</span></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
